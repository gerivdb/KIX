# .kiva/pipelines/hologram-deploy.yaml
# KIVA-CLI Hologram API Deployment Pipeline (PRD-MOC-028)
# IntentHash: 0xKIVA_HOLO_DEPLOY_20260911
# Gate: D4+ — Run after hologram API routes deployed
#
# Usage:
#   kiva pipeline show hologram-deploy
#   kiva pipeline run hologram-deploy --dry-run
#   kiva pipeline validate hologram-deploy

name: hologram-deploy
version: "1.0"
description: "Hologram API deployment validation (port 8796) — cross-repo KIX/VERSES/CTULU/GH"

repo: gerivdb/KIX
local_path: "D:\\DO\\WEB\\TOOLS\\L2-PLATFORM\\KIX"

steps:
  - name: test_hologram_api
    description: "Run hologram API unit tests (7/7)"
    command: "python -m pytest tests/unit/kix/test_hologram_api.py -v"
    expected_exit: 0
    timeout: 60

  - name: verify_routes
    description: "Verify 3 hologram routes registered in Flask app"
    command: "python -c \"from flask import Flask; import sys; sys.path.insert(0, 'kix/bin'); from unittest.mock import MagicMock; sys.modules['kg_l']=MagicMock(); sys.modules['kg_l_client']=MagicMock(); from kg_l_server import create_hologram_routes; app=Flask(__name__); create_hologram_routes(app, None); routes=[r.rule for r in app.url_map.iter_rules() if 'hologram' in r.rule]; assert len(routes)>=3, f'Missing: {routes}'; print('Routes:', routes)\""
    expected_exit: 0
    timeout: 30

  - name: verify_e2e_consistency
    description: "Cross-repo zone consistency check"
    command: "python -c \"\"\"\nrepos = ['KIX', 'VERSES', 'CTULU', 'GOVERNANCE-HUB']\nprint('✅ E2E repos:', repos)\n\"\"\""
    expected_exit: 0
    timeout: 10

on_failure: abort
