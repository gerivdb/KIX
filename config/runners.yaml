runners:
  - name: gateway-manager
    runner_type: gateway-exe
    port: 9000
    working_dir: D:/DO/WEB/TOOLS/L1-INFRA/GATEWAY-MANAGER
    command: ["gateway-manager", "start", "--port", "9000"]
    bootstrap: false
    health_path: /health
    restart_policy: always
    log_file: D:/DO/WEB/TOOLS/L1-INFRA/GATEWAY-MANAGER/data/gateway.log
    meta:
      repo: gerivdb/GATEWAY-MANAGER
      role: BDCP proxy, PAT rotation

  - name: bootstrap
    runner_type: python
    port: 8810
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: services/bootstrap_runner.py
    bootstrap: true
    auto_start: true
    health_path: /health
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX/logs/bootstrap.log
    dependencies:
      - gateway-manager
      - kix
      - arbiter
      - trixd
      - wazaa
      - flex-api
    kgl_schema: schemas/runners/bootstrap-status.schema.json
    meta:
      repo: gerivdb/GOVERNANCE-HUB
      role: bootstrap orchestrator
      intent_hash: 0xINTENT_BOOTSTRAP_RUNNER_GOVERNANCE_20260820

  - name: trixd
    runner_type: zig-binary
    port: 7243
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX
    binary: zig-out/bin/trixd.exe
    build:
      command: ["C:/DevTools/bin/zig/zig.exe", "build", "trixd"]
      required: false
      pre_start: false
    depends_on: [kix]
    health_path: /health
    headers:
      Authorization: "Bearer ${TRIX_DAEMON_TOKEN}"
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/data/trixd.log
    meta:
      repo: gerivdb/TRIX
      role: zig runtime

  - name: wazaa
    runner_type: python
    port: 5002
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/WAZAA
    entrypoint: tools/mission_control/server.py
    health_path: /health
    depends_on: [kix]
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/WAZAA/data/wazaa.log
    meta:
      repo: gerivdb/WAZAA
      role: multi-agent orchestration

  - name: flex-api
    runner_type: zig-binary
    port: 8080
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/FLEX
    binary: zig-out/bin/flex-api.exe
    health_path: /numa/status
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/FLEX/logs/flex-api.log
    meta:
      repo: gerivdb/FLEX
      role: harmony topology ENV2

  - name: conversation-cognitive
    runner_type: python
    port: 8811
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: services/conversation_cognitive_runner.py
    bootstrap: false
    auto_start: false
    health_path: /cognitive/conversation/health
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX/logs/conversation_cognitive.log
    dependencies:
      - kix
      - tlm-lang
      - chronox
      - referex
      - talex
      - rootx
      - wazaa
    kgl_schema: schemas/runners/cognitive-conversation-decision.schema.json
    meta:
      repo: gerivdb/GOVERNANCE-HUB
      role: conversation decision extraction and KG-L publishing
      intent_hash: 0xINTENT_COGNITIVE_CONVERSATION_RUNNER_KG_L_WAZAA_20260821

  - name: kg-l-coherence-watchdog
