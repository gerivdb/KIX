bootstrap:
  - gateway-manager
  - kix

runners:
  - name: kg-l-coherence-watchdog
    runner_type: python
    port: 8841
    depends_on:
      - kix
      - wazaa
  - name: nodex
    runner_type: python
    port: 8821
    depends_on:
      - ontology
      - knowledge-graph-memory
  - name: rootx
    runner_type: python
    port: 8823
    depends_on:
      - knowledge-graph-memory
  - name: talex
    runner_type: python
    port: 8822
    depends_on:
      - llux
      - rlm243
      - timx-feature-store
      - rootx
      - llm-core
  - name: friction-analyzer
    runner_type: python
    port: 8815
    depends_on:
      - conversation-cognitive
      - rlm-incident
      - rootx
      - prognex
      - referex
  - name: agent-manager
    runner_type: gateway-exe
    port: 18000
    depends_on:
      - kix
  - name: trixd
    runner_type: zig-binary
    port: 7243
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX
    binary: zig-out/bin/trixd.exe
    build:
      command: ["zig", "build", "trixd"]
      required: true
      pre_start: true
    depends_on:
      - kix
    health_path: /health
    headers:
      Authorization: "Bearer ${TRIX_DAEMON_TOKEN}"
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/data/trixd.log
    pid_file: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/data/trixd.pid
    meta:
      repo: gerivdb/TRIX
      role: zig runtime
  - name: batmcp
    runner_type: gateway-exe
    port: 8000
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/BatMCP
    command:
      - "python"
      - "-m"
      - "uvicorn"
      - "src.server:app"
      - "--host"
      - "localhost"
      - "--port"
      - "8000"
    depends_on:
      - kix
    health_path: /health
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/BatMCP/logs/batmcp.log
    pid_file: D:/DO/WEB/TOOLS/L4-TOOLS/BatMCP/logs/batmcp.pid
    meta:
      repo: gerivdb/BatMCP
      role: mcp-server
