bootstrap:
  - gateway-manager
  - kix

runners:
  - name: kg-l-coherence-watchdog
    runner_type: python
    port: 8841
    depends_on:
      - kix
      - wazaa
  - name: nodex
    runner_type: python
    port: 8821
    depends_on:
      - ontology
      - knowledge-graph-memory
  - name: rootx
    runner_type: python
    port: 8823
    depends_on:
      - knowledge-graph-memory
  - name: talex
    runner_type: python
    port: 8822
    depends_on:
      - llux
      - rlm243
      - timx-feature-store
      - rootx
      - llm-core
  - name: friction-analyzer
    runner_type: python
    port: 8815
    depends_on:
      - conversation-cognitive
      - rlm-incident
      - rootx
      - prognex
      - referex
  - name: agent-manager
    runner_type: gateway-exe
    port: 18000
    depends_on:
      - kix
  - name: trixd
    runner_type: zig-binary
    port: 7243
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX
    binary: zig-out/bin/trixd.exe
    build:
      command: ["zig", "build", "trixd"]
      required: true
      pre_start: true
    depends_on:
      - kix
    health_path: /health
    headers:
      Authorization: "Bearer ${TRIX_DAEMON_TOKEN}"
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/data/trixd.log
    pid_file: D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/data/trixd.pid
    meta:
      repo: gerivdb/TRIX
      role: zig runtime
  - name: batmcp
    runner_type: gateway-exe
    port: 8000
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/BatMCP
    command:
      - "python"
      - "-m"
      - "uvicorn"
      - "src.server:app"
      - "--host"
      - "localhost"
      - "--port"
      - "8000"
    depends_on:
      - kix
    health_path: /health
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/BatMCP/logs/batmcp.log
    pid_file: D:/DO/WEB/TOOLS/L4-TOOLS/BatMCP/logs/batmcp.pid
    meta:
      repo: gerivdb/BatMCP
      role: mcp-server
  - name: kix
    runner_type: python
    port: 8800
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: src/app.py
    depends_on: []
    health_path: /health
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX/logs/kix.log
    pid_file: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX/logs/kix.pid
    meta:
      repo: gerivdb/KIX
      role: orchestrator
    bootstrap: true
    auto_start: false
  - name: bootstrap
    runner_type: python
    port: 8810
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: services/bootstrap_runner.py
    depends_on:
      - gateway-manager
      - kix
    health_path: /bootstrap/status
    restart_policy: on-failure
    meta:
      repo: gerivdb/KIX
      role: bootstrap orchestrator
    bootstrap: true
    auto_start: false
  - name: rlm-metrics
    runner_type: service
    port: 8802
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: metrics collector
  - name: rlm-config
    runner_type: service
    port: 8794
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: configuration service
  - name: rlm-deploy
    runner_type: service
    port: 8795
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: deployment service
  - name: rlm-graph
    runner_type: service
    port: 8797
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: graph service
  - name: rlm-secure
    runner_type: service
    port: 8796
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: security service
  - name: rlm-incident
    runner_type: service
    port: 8798
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: incident service
  - name: rlm-release
    runner_type: service
    port: 8799
    working_dir: D:/DO/WEB/TOOLS/L2-PLATFORM/KIX
    entrypoint: service.py
    depends_on:
      - kix
    meta:
      repo: gerivdb/KIX
      role: release service
  - name: kg-l
    runner_type: python
    port: 8888
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/KG-L
    entrypoint: kg_l_server.py
    depends_on:
      - kix
    health_path: /health
    restart_policy: on-failure
    log_file: D:/DO/WEB/TOOLS/L4-TOOLS/KG-L/logs/kg_l.log
    pid_file: D:/DO/WEB/TOOLS/L4-TOOLS/KG-L/logs/kg_l.pid
    meta:
      repo: gerivdb/KG-L
      role: knowledge-graph service
  - name: jevx
    runner_type: service
    port: 8889
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/JEVX
    entrypoint: src/server.ts
    depends_on:
      - kix
    meta:
      repo: gerivdb/JEVX
      role: decision-engine
  - name: flex-rust
    runner_type: rust
    port: 7718
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/FLEX
    binary: cargo
    command:
      - "cargo"
      - "run"
      - "--bin"
      - "flex-api"
    depends_on:
      - kix
    health_path: /health
    restart_policy: on-failure
    meta:
      repo: gerivdb/FLEX
      role: rust-service
  - name: go-service
    runner_type: go
    port: 7717
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/GO-SERVICE
    entrypoint: main.go
    command:
      - "go"
      - "run"
      - "."
    depends_on:
      - kix
    health_path: /health
    restart_policy: on-failure
    meta:
      repo: gerivdb/GO-SERVICE
      role: go-service
  - name: node-service
    runner_type: node
    port: 7716
    working_dir: D:/DO/WEB/TOOLS/L4-TOOLS/NODE-SERVICE
    entrypoint: server.js
    command:
      - "node"
      - "server.js"
    depends_on:
      - kix
    health_path: /health
    restart_policy: on-failure
    meta:
      repo: gerivdb/NODE-SERVICE
      role: node-service
