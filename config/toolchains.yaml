# KIX Toolchains Registry
# Contrat déclaratif des outils système / runtimes CLI utilisés par KIX.
# Schéma : name / path / version_flag / timeout / sha256 (optionnel)

toolchains:
  - name: zig
    path: C:/DevTools/bin/zig/zig.exe
    version_flag: --version
    timeout: 5.0
    role: compiler
    meta:
      repo: gerivdb/TRIX
      usage: "Compilation TRIX/LLUX/ROOTX"

  - name: python
    path: C:/Users/GG/AppData/Local/Programs/Python/Python312/python.exe
    version_flag: --version
    timeout: 5.0
    role: runtime
    meta:
      repo: gerivdb/KIX
      usage: "Services Python KIX/WAZAA/GATEWAY-MANAGER"

  - name: cargo
    path: C:/DevTools/.cargo/bin/cargo.exe
    version_flag: --version
    timeout: 5.0
    role: package-manager
    meta:
      repo: gerivdb/FLEX
      usage: "Compilation services Rust"

  - name: rustc
    path: C:/DevTools/.cargo/bin/rustc.exe
    version_flag: --version
    timeout: 5.0
    role: compiler
    meta:
      repo: gerivdb/FLEX
      usage: "Compilation services Rust"

  - name: node
    path: C:/DevTools/bin/node/node.exe
    version_flag: --version
    timeout: 5.0
    role: runtime
    meta:
      repo: gerivdb/JEVX
      usage: "Services Node.js"

  - name: git
    path: C:/DevTools/git/cmd/git.exe
    version_flag: --version
    timeout: 5.0
    role: vcs
    meta:
      repo: gerivdb/GOVERNANCE-HUB
      usage: "Gestionnaire de versions"

  - name: pwsh
    path: C:/Program Files/PowerShell/7/pwsh.exe
    version_flag: --version
    timeout: 5.0
    role: shell
    meta:
      repo: gerivdb/KIX
      usage: "Scripts PowerShell KIX"
